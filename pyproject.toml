[project]
name = "laberinto"
version = "0.1.0"
description = "Text-model vs decisions-model race through a procedural maze"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.scripts]
maze = "maze.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maze"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
